<!doctype html>
<html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>業間マラソン</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#fff6e6;color:#183c31;font:16px system-ui,sans-serif}main{max-width:760px;margin:auto;padding:24px 16px}header,section{padding:24px;border-radius:22px;margin-bottom:16px}header,button{background:#185542;color:white}h1,h2{margin:0 0 12px}h1{font-size:clamp(28px,7vw,55px);margin:0}section{background:white;border:1px solid #e2d9c6}.row{display:flex;gap:12px;flex-wrap:wrap;align-items:end}input{display:block;padding:8px;border:1px solid #85988d;border-radius:8px;font:inherit;max-width:100%}button{border:0;border-radius:10px;padding:12px 18px;font:inherit;font-weight:bold;text-decoration:none;cursor:pointer}button:disabled{opacity:.45}#count{font-size:52px}canvas{display:block;width:100%;height:auto;margin:14px 0}[hidden]{display:none!important}
#room{overflow:hidden}#scene{position:relative;isolation:isolate;aspect-ratio:1.85;background:#e4f2ed;border-radius:16px;overflow:hidden}
.room-plane{position:absolute;inset:0}
.room-wall-left{background:#ffedd3;clip-path:polygon(10% 31%,50% 7%,50% 42%,10% 66%)}
.room-wall-right{background:#f5d9ad;clip-path:polygon(50% 7%,90% 31%,90% 66%,50% 42%)}
.room-floor{background:repeating-linear-gradient(150deg,#dba779 0 10px,#e5b68b 10px 20px);clip-path:polygon(10% 66%,50% 42%,90% 66%,50% 90%)}
.room-edge{background:#b57d53;clip-path:polygon(10% 66%,50% 90%,90% 66%,90% 69%,50% 94%,10% 69%)}
.furniture{position:absolute;transform:translate(-50%,-100%);height:auto;filter:drop-shadow(1px 3px 1px #663c3a40);pointer-events:none}
.furniture.new{animation:arrive .42s ease-out both}
@keyframes arrive{from{transform:translate(-50%,-135%);opacity:0}to{transform:translate(-50%,-100%);opacity:1}}
@media(prefers-reduced-motion:reduce){.furniture.new{animation:none}}
.room-meta{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin:12px 0}
.room-nav{display:flex;align-items:center;gap:8px}.room-nav button{padding:8px 12px}
#roomStatus{min-height:1.5em;margin:8px 0;font-weight:bold;color:#185542}
#roomInventory{margin:6px 0 0;font-size:.95rem}

@media print{@page{size:A4 landscape;margin:8mm}body{background:white}main,section{max-width:none;margin:0;padding:0;border:0}header,#record,#room,h2,form,#actions{display:none!important}canvas{margin:0;max-height:190mm;object-fit:contain}}
.room-3d .room-plane,.room-3d #furniture{display:none}.room-3d canvas{position:absolute;inset:0;width:100%;height:100%;margin:0;touch-action:none;cursor:grab}.room-3d canvas:active{cursor:grabbing}#layoutFurniture{display:block;font:inherit;padding:8px;background:white;color:#183c31;border:1px solid #85988d;border-radius:8px}#layoutMessage{min-height:1.5em;margin:8px 0}
</style>
<main><header><h1>業間マラソン</h1></header>
<section id="record"><h2>今日の記録</h2><div id="today"></div><p aria-live="polite"><strong id="count">0</strong> 周</p><div class="row"><button id="plus">＋1周</button><button id="minus">−1周</button></div><p>これまで <b id="all">0</b> 周</p><p id="error" role="alert"></p><details><summary>日別の記録</summary><ul id="history"></ul></details></section>
<section id="room">
<h2>わたしの部屋</h2>
<div id="scene" aria-hidden="true">
<div class="room-plane room-wall-left"></div><div class="room-plane room-wall-right"></div>
<div class="room-plane room-edge"></div><div class="room-plane room-floor"></div><div id="furniture"></div>
</div>
<p id="roomMode">ドラッグで視点を回し、ピンチやスクロールで拡大できます。</p>
<div id="layoutTools" hidden>
<div class="row">
<label>配置する家具<select id="layoutFurniture"><option value="">家具を選ぶ</option></select></label>
<button id="layoutTurn" disabled>家具を90°回す</button>
<button id="layoutReset">視点をもどす</button>
</div>
<p id="layoutMessage" role="status"></p>
</div>

<p id="roomStatus" role="status">1周走ると、家具が1つ増えるよ。</p>
<div class="room-meta"><strong id="furnitureCount"></strong><div id="roomNav" class="room-nav" hidden><button id="previousRoom">前の部屋</button><span id="roomNumber"></span><button id="nextRoom">次の部屋</button></div></div>
<p id="roomInventory"></p>
</section>

<section><h2>賞状を作る</h2><form id="form"><div class="row"><label>名前<input id="student" maxlength="30" required></label><label>開始日<input id="start" type="date" required></label><label>終了日<input id="end" type="date" required></label><button>賞状を表示</button></div><p id="message" role="status"></p></form>
<div id="preview" hidden><canvas id="award" width="2480" height="1754" role="img"></canvas><div id="actions"><div class="row"><button id="copy">賞状の画像をコピー</button><button id="print">印刷する</button></div><p id="copyStatus" role="status"></p><p>ロイロノートに提出するときは、コピーした画像をノートに貼り付けてから提出してください。</p></div></div></section></main>
<script>
const el = id => document.getElementById(id);
const storageKey = 'gyoukan-marathon-v1';
const today = () => new Intl.DateTimeFormat('sv-SE', {timeZone:'Asia/Tokyo'}).format(new Date());
const dateText = day => day.replaceAll('-', '/');
const dates = () => Object.keys(records).sort();
const sum = days => days.reduce((total, day) => total + records[day], 0);
let records = {};
try {
  const stored = JSON.parse(localStorage.getItem(storageKey) || '{}');
  records = Object.fromEntries(Object.entries(stored).filter(([day, laps]) =>
    /^\d{4}-\d{2}-\d{2}$/.test(day) && Number.isSafeInteger(laps) && laps > 0));
} catch {
  el('error').textContent = '保存した記録を読み込めませんでした。';
  el('plus').disabled = true;
}
const furniture = [
  ['lampRoundFloor', 'フロアランプ', 37, 58, 5],
  ['pottedPlant', '観葉植物', 63, 58, 6],
  ['chairCushion', 'クッションチェア', 46, 70, 8],
  ['sideTable', 'サイドテーブル', 25, 67, 10],
  ['loungeSofa', 'ソファ', 53, 58, 15],
  ['tableCoffee', 'ローテーブル', 58, 70, 13],
  ['bookcaseOpen', '本棚', 45, 53, 10],
  ['bear', 'くまのぬいぐるみ', 53, 81, 8],
  ['bedSingle', 'ベッド', 72, 68, 16],
  ['desk', '勉強机', 34, 70, 13],
  ['radio', 'ラジオ', 43, 78, 7],
  ['televisionVintage', 'レトロテレビ', 63, 77, 9]
];
let roomIndex = 0;
const lastRoom = total => Math.max(0, Math.ceil(total / furniture.length) - 1);

function renderRoom(total, animate) {
  roomIndex = Math.min(roomIndex, lastRoom(total));
  const visible = furniture.slice(0, Math.max(0, total - roomIndex * furniture.length));
  const ordered = [...visible].sort((first, second) => first[3] - second[3]);
  el('furniture').replaceChildren(...ordered.map(item => {
    const [file, name, x, y, width] = item;
    const image = document.createElement('img');
    image.className = 'furniture' + (animate && item === visible.at(-1) ? ' new' : '');
    image.src = 'furniture/Isometric/' + file + '_SE.png';
    image.alt = '';
    image.style.left = x + '%';
    image.style.top = y + '%';
    image.style.width = width + '%';
    return image;
  }));
  document.dispatchEvent(new CustomEvent('marathon-room-update', {detail:{index:roomIndex, items:visible}}));
  el('furnitureCount').textContent = '集めた家具 ' + total + 'こ';
  el('roomInventory').textContent = visible.length ? visible.map(item => item[1]).join('、') : 'まだ家具はありません。';
  el('roomNav').hidden = lastRoom(total) === 0;
  el('roomNumber').textContent = (roomIndex + 1) + ' / ' + (lastRoom(total) + 1);
  el('previousRoom').disabled = roomIndex === 0;
  el('nextRoom').disabled = roomIndex === lastRoom(total);
}


function render(animate = false) {
  const day = today();
  el('today').textContent = dateText(day);
  el('count').textContent = records[day] || 0;
  el('minus').disabled = !records[day];
  const total = sum(dates());
  el('all').textContent = total;
  renderRoom(total, animate);
  el('history').replaceChildren(...dates().reverse().map(date => {
    const row = document.createElement('li');
    row.textContent = dateText(date) + '　' + records[date] + '周';
    return row;
  }));
}
function hidePreview() {
  el('preview').hidden = true;
  el('copyStatus').textContent = '';
  el('message').textContent = '';
}
function record(delta) {
  const day = today();
  const updated = {...records};
  const laps = (updated[day] || 0) + delta;
  if (laps > 0) updated[day] = laps;
  else delete updated[day];
  try {
    localStorage.setItem(storageKey, JSON.stringify(updated));
  } catch {
    el('error').textContent = 'このブラウザに記録を保存できません。';
    return;
  }
  records = updated;
  el('error').textContent = '';
  hidePreview();
  const total = sum(dates());
  roomIndex = lastRoom(total);
  if (delta > 0) {
    const name = furniture[(total - 1) % furniture.length][1];
    el('roomStatus').textContent = name + 'をゲット！';
  } else {
    const name = furniture[total % furniture.length][1];
    el('roomStatus').textContent = '1周取り消して、' + name + 'をもどしました。';
  }
  render(delta > 0);
}
el('start').value = dates()[0] || today();
el('end').value = today();
el('plus').onclick = () => record(1);
el('minus').onclick = () => record(-1);
el('print').onclick = () => window.print();
el('copy').onclick = async () => {
  const button = el('copy');
  const status = el('copyStatus');
  button.disabled = true;
  status.textContent = '';
  try {
    const png = new Promise((resolve, reject) => el('award').toBlob(blob => {
      if (blob) resolve(blob);
      else reject(new Error('PNG encoding failed'));
    }, 'image/png'));
    await navigator.clipboard.write([new ClipboardItem({'image/png': png})]);
    status.textContent = '賞状の画像をコピーしました。';
  } catch {
    status.textContent = '画像をコピーできませんでした。ブラウザのクリップボード設定を確認してください。';
  } finally {
    button.disabled = false;
  }
};
el('form').oninput = hidePreview;
el('previousRoom').onclick = () => {
  if (roomIndex > 0) roomIndex -= 1;
  renderRoom(sum(dates()), false);
};
el('nextRoom').onclick = () => {
  const total = sum(dates());
  if (roomIndex < lastRoom(total)) roomIndex += 1;
  renderRoom(total, false);
};
document.addEventListener('marathon-room-ready', () => renderRoom(sum(dates()), false));
window.addEventListener('focus', () => render());
roomIndex = lastRoom(sum(dates()));
render();
el('form').onsubmit = event => {
  event.preventDefault();
  hidePreview();
  const name = el('student').value.trim();
  const start = el('start').value;
  const end = el('end').value;
  if (!name || start > end || end > today()) {
    el('message').textContent = '名前と、今日までの正しい期間を入力してください。';
    return;
  }
  const laps = sum(dates().filter(day => day >= start && day <= end));
  if (!laps) {
    el('message').textContent = 'この期間には記録がありません。';
    return;
  }
  const canvas = el('award');
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#fffcf2';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.strokeStyle = '#a17831';
  ctx.lineWidth = 10;
  ctx.strokeRect(65, 65, 2350, 1624);
  ctx.lineWidth = 3;
  ctx.strokeRect(90, 90, 2300, 1574);
  function line(text, y, size) {
    ctx.fillStyle = '#194938';
    ctx.font = 'bold ' + size + 'px "Yu Gothic", "Hiragino Sans", sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(text, 1240, y, 2040);
  }
  line('業間マラソン', 310, 72);
  line('賞 状', 545, 180);
  line(name + ' さん', 755, 96);
  line('合計 ' + laps + ' 周', 1080, 180);
  line(dateText(start) + ' 〜 ' + dateText(end), 1240, 62);
  line('業間マラソンでのがんばりをたたえます。', 1460, 56);
  canvas.setAttribute('aria-label', name + 'さん、' + start + 'から' + end + 'まで、合計' + laps + '周');
  el('preview').hidden = false;
};
</script><script type="module" src="room3d.js"></script></html>
