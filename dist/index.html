<!doctype html>
<html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>業間マラソン</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#fff6e6;color:#183c31;font:16px system-ui,sans-serif}main{max-width:760px;margin:auto;padding:24px 16px}header,section{padding:24px;border-radius:22px;margin-bottom:16px}header,button{background:#185542;color:white}h1,h2{margin:0 0 12px}h1{font-size:clamp(28px,7vw,55px);margin:0}section{background:white;border:1px solid #e2d9c6}.row{display:flex;gap:12px;flex-wrap:wrap;align-items:end}input{display:block;padding:8px;border:1px solid #85988d;border-radius:8px;font:inherit;max-width:100%}button{border:0;border-radius:10px;padding:12px 18px;font:inherit;font-weight:bold;text-decoration:none;cursor:pointer}button:disabled{opacity:.45}#count{font-size:52px}canvas{display:block;width:100%;height:auto;margin:14px 0}[hidden]{display:none!important}
#room{overflow:hidden}#scene{position:relative;aspect-ratio:1.55;overflow:hidden;border-radius:18px;background:#d9eddf}
.cat-placeholder{display:grid;place-items:center;position:absolute;inset:0;font-size:clamp(64px,20vw,132px)}
.room-3d .cat-placeholder{display:none}.room-3d canvas{position:absolute;inset:0;width:100%;height:100%;margin:0;touch-action:none;cursor:grab}.room-3d canvas:active{cursor:grabbing}
#catStage{margin:0 0 6px;font-size:1.25rem}#catStatus{min-height:1.5em;margin:.5em 0 0;color:#185542;font-weight:700}
#catProgress{width:100%;height:14px;accent-color:#24775d}#roomMode{margin:.7em 0;color:#355c50;font-size:.94rem}
#catControls button{background:#e5f2e9;color:#185542}

@media print{@page{size:A4 landscape;margin:8mm}body{background:white}main,section{max-width:none;margin:0;padding:0;border:0}header,#record,#room,h2,form,#actions{display:none!important}canvas{margin:0;max-height:190mm;object-fit:contain}}
</style>
<main><header><h1>業間マラソン</h1></header>
<section id="record"><h2>今日の記録</h2><div id="today"></div><p aria-live="polite"><strong id="count">0</strong> 周</p><div class="row"><button id="plus">＋1周</button><button id="minus">−1周</button></div><p>これまで <b id="all">0</b> 周</p><p id="error" role="alert"></p><details><summary>日別の記録</summary><ul id="history"></ul></details></section>
<section id="room">
<h2>ねこの部屋</h2>
<p id="catStage"></p>
<div id="scene"><span class="cat-placeholder" role="img" aria-label="ねこ">🐈</span></div>
<p id="roomMode">ドラッグで視点を回し、ピンチやスクロールで拡大できます。</p>
<div id="catControls" class="row" hidden><button id="catMotion">動きを止める</button><button id="catReset">視点をもどす</button></div>
<p id="catStatus" role="status"></p>
<p id="catGoal"></p><progress id="catProgress" aria-label="次の成長までの周回"></progress>
</section>


<section><h2>賞状を作る</h2><form id="form"><div class="row"><label>名前<input id="student" maxlength="30" required></label><label>開始日<input id="start" type="date" required></label><label>終了日<input id="end" type="date" required></label><button>賞状を表示</button></div><p id="message" role="status"></p></form>
<div id="preview" hidden><canvas id="award" width="2480" height="1754" role="img"></canvas><div id="actions"><div class="row"><button id="copy">賞状の画像をコピー</button><button id="print">印刷する</button></div><p id="copyStatus" role="status"></p><p>ロイロノートに提出するときは、コピーした画像をノートに貼り付けてから提出してください。</p></div></div></section></main>
<script>
const el = id => document.getElementById(id);
const storageKey = 'gyoukan-marathon-v1';
const today = () => new Intl.DateTimeFormat('sv-SE', {timeZone:'Asia/Tokyo'}).format(new Date());
const dateText = day => day.replaceAll('-', '/');
const dates = () => Object.keys(records).sort();
const sum = days => days.reduce((total, day) => total + records[day], 0);
let records = {};
try {
  const stored = JSON.parse(localStorage.getItem(storageKey) || '{}');
  records = Object.fromEntries(Object.entries(stored).filter(([day, laps]) =>
    /^\d{4}-\d{2}-\d{2}$/.test(day) && Number.isSafeInteger(laps) && laps > 0));
} catch {
  el('error').textContent = '保存した記録を読み込めませんでした。';
  el('plus').disabled = true;
}
const catStages = [
  {laps:0, name:'ちいさな子ねこ'},
  {laps:5, name:'げんきな子ねこ'},
  {laps:15, name:'わかいねこ'},
  {laps:35, name:'おとなのねこ'},
  {laps:70, name:'りっぱなねこ'}
];
const catStage = total => catStages.findLastIndex(stage => total >= stage.laps);
function renderCat(total) {
  const index = catStage(total);
  const stage = catStages[index];
  const next = catStages[index + 1];
  el('catStage').textContent = stage.name;
  el('catProgress').hidden = !next;
  if (next) {
    el('catProgress').max = next.laps - stage.laps;
    el('catProgress').value = total - stage.laps;
  }
  el('catGoal').textContent = next ? '次の成長まであと ' + (next.laps - total) + ' 周' : '走った分だけ、これからも少しずつ育ちます。';
  document.dispatchEvent(new CustomEvent('marathon-cat-update', {detail:total}));
}


function render() {
  const day = today();
  el('today').textContent = dateText(day);
  el('count').textContent = records[day] || 0;
  el('minus').disabled = !records[day];
  const total = sum(dates());
  el('all').textContent = total;
  renderCat(total);
  el('history').replaceChildren(...dates().reverse().map(date => {
    const row = document.createElement('li');
    row.textContent = dateText(date) + '　' + records[date] + '周';
    return row;
  }));
}
function hidePreview() {
  el('preview').hidden = true;
  el('copyStatus').textContent = '';
  el('message').textContent = '';
}
function record(delta) {
  const day = today();
  const updated = {...records};
  const laps = (updated[day] || 0) + delta;
  if (laps > 0) updated[day] = laps;
  else delete updated[day];
  try {
    localStorage.setItem(storageKey, JSON.stringify(updated));
  } catch {
    el('error').textContent = 'このブラウザに記録を保存できません。';
    return;
  }
  records = updated;
  el('error').textContent = '';
  hidePreview();
  const total = sum(dates());
  const level = catStage(total);
  el('catStatus').textContent = delta < 0 ? '1周取り消しました。' :
    level > catStage(total - 1) ? '成長したよ！ ' + catStages[level].name : '1周ぶん、ねこが育ったよ！';
  render();
}
el('start').value = dates()[0] || today();
el('end').value = today();
el('plus').onclick = () => record(1);
el('minus').onclick = () => record(-1);
el('print').onclick = () => window.print();
el('copy').onclick = async () => {
  const button = el('copy');
  const status = el('copyStatus');
  button.disabled = true;
  status.textContent = '';
  try {
    const png = new Promise((resolve, reject) => el('award').toBlob(blob => {
      if (blob) resolve(blob);
      else reject(new Error('PNG encoding failed'));
    }, 'image/png'));
    await navigator.clipboard.write([new ClipboardItem({'image/png': png})]);
    status.textContent = '賞状の画像をコピーしました。';
  } catch {
    status.textContent = '画像をコピーできませんでした。ブラウザのクリップボード設定を確認してください。';
  } finally {
    button.disabled = false;
  }
};
el('form').oninput = hidePreview;
document.addEventListener('marathon-cat-ready', () => renderCat(sum(dates())));
window.addEventListener('focus', () => render());
render();
el('form').onsubmit = event => {
  event.preventDefault();
  hidePreview();
  const name = el('student').value.trim();
  const start = el('start').value;
  const end = el('end').value;
  if (!name || start > end || end > today()) {
    el('message').textContent = '名前と、今日までの正しい期間を入力してください。';
    return;
  }
  const laps = sum(dates().filter(day => day >= start && day <= end));
  if (!laps) {
    el('message').textContent = 'この期間には記録がありません。';
    return;
  }
  const canvas = el('award');
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#fffcf2';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.strokeStyle = '#a17831';
  ctx.lineWidth = 10;
  ctx.strokeRect(65, 65, 2350, 1624);
  ctx.lineWidth = 3;
  ctx.strokeRect(90, 90, 2300, 1574);
  function line(text, y, size) {
    ctx.fillStyle = '#194938';
    ctx.font = 'bold ' + size + 'px "Yu Gothic", "Hiragino Sans", sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(text, 1240, y, 2040);
  }
  line('業間マラソン', 310, 72);
  line('賞 状', 545, 180);
  line(name + ' さん', 755, 96);
  line('合計 ' + laps + ' 周', 1080, 180);
  line(dateText(start) + ' 〜 ' + dateText(end), 1240, 62);
  line('業間マラソンでのがんばりをたたえます。', 1460, 56);
  canvas.setAttribute('aria-label', name + 'さん、' + start + 'から' + end + 'まで、合計' + laps + '周');
  el('preview').hidden = false;
};
</script><script type="module" src="room3d.js"></script></html>
